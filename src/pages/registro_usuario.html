<!DOCTYPE html>
<!--Se utiliza la etiqueta DOCTYPE  para informa al navegador qué versión de HTML (o XML) se usó para escribir el documento.-->
<html lang="es"><!--Establece el idioma del documento usando el atributo lang-->
<head><!--Contiene información general sobre el documento, como el título, los estilos y los metadatos.-->
    <meta charset="UTF-8"><!--Establece la codificación de caracteres para el documento.-->
    <meta name="Quorum360" content="Quorum360 - Software de Administración de Propiedad Horizontal Eficiente y Seguro">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Establece la escala de la página y la anchura de la ventana gráfica. permitiendo ser responsive y escalable el codigo-->
    <meta name="description"
        content="Optimiza la gestión de condominios con nuestro software especializado para propiedad horizontal. Aplicando la ley 675 de 2001 en Colombia">
    <!--Establece una descripción de la página. permite mejorar la busqueda y da posicionamiento SEO-->
    <meta name="robots" content="index, follow">
    <!--Permite a los motores de búsqueda indexar la página y seguir los enlaces.-->
    <meta name="keywords"
        content="propiedad horizontal, ley 675 de 2001, administracion de propiedad horizontal, software, propiedad horizontal software, gestión condominios, administración residencias, Quorum360, gestión financiera de condominios">
    <!--Establece palabras clave para la página. permite mejorar la busqueda y da posicionamiento SEO-->
    <meta name="Aley Cabrera D" content="Quorum360 Team"><!--Establece el autor de la página.-->
    <meta property="og:title" content="Quorum360 - Software de Propiedad Horizontal">
    <meta property="og:description" content="Optimiza la gestión de condominios con nuestro software especializado">
    <meta property="og:image" content="/src/assets/image/Q360.png">
    <meta property="og:url" content="https://quorum360.com">
    <meta property="og:site_name" content="Quorum360">
    <meta http-equiv="X-UA-Compatible" content="ie=edge"><!--Establece el modo de compatibilidad del navegador.-->
    <link rel="icon" href="/src/assets/iconos/quorum360.ico" type="image/x-icon"><!--Establece el icono de la página.-->
    <link rel="stylesheet" type="text/css" href="/src/styles/style_registro_usuario.css">
    <!--Establece la hoja de estilos de la página.-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="../styles/phone-select.css" rel="stylesheet">
    <title>Registro - Quorum360</title>
    </head>
    
    <body>
        <div class="main-container">
            <section class="hero-section">
                <div class="hero-content">
                    <img src="/src/assets/image/Q360.png" alt="Quorum360">
                    <h1>Únete a Quorum360</h1>
                    <p>La solución integral para la gestión eficiente de propiedades horizontales</p>
                </div>
            </section>
    
            <section class="registration-section">
                <div class="registration-container">
                    <div class="registration-header">
                        <h2>Registro de Residente</h2>
                        <p>Complete el formulario para crear su cuenta</p>
                    </div>
    
                    <!-- Mensaje de error -->
                    <div id="error-message" class="alert alert-danger" style="display: none;">
                        <i class="fas fa-exclamation-circle"></i> <span id="error-text"></span>
                    </div>
    
                    <form id="registrationForm" class="registration-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">Primer Nombre</label>
                                <input type="text" id="firstName" name="firstName" class="form-control" placeholder="Ian"
                                    required>
                            </div>
    
                            <div class="form-group">
                                <label for="middleName">Segundo Nombre</label>
                                <input type="text" id="middleName" name="middleName" class="form-control"
                                    placeholder="Said (Opcional)">
                            </div>
                        </div>
    
                        <div class="form-row">
                            <div class="form-group">
                                <label for="lastName">Primer Apellido</label>
                                <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Rueda"
                                    required>
                            </div>
    
                            <div class="form-group">
                                <label for="secondLastName">Segundo Apellido</label>
                                <input type="text" id="secondLastName" name="secondLastName" class="form-control"
                                    placeholder="Cabrera" required>
                            </div>
                        </div>
    
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="email" name="email" class="form-control"
                                    placeholder="ejemplo@dominio.com" required>
                            </div>
                        </div>
    
                        <div class="form-group">
                            <label for="phone">Teléfono</label>
                            <div class="phone-input-container">
                                <div class="country-code-selector">
                                    <select id="countryCode" name="countryCode" class="form-control" required>
                                        <option value="+57" data-flag="co">+57 Colombia</option>
                                        <option value="+1" data-flag="us">+1 USA</option>
                                        <option value="+52" data-flag="mx">+52 México</option>
                                        <!-- Más opciones de país -->
                                    </select>
                                </div>
                                <input type="tel" id="phone" name="phone" class="form-control" placeholder="3001234567"
                                    required>
                            </div>
                        </div>
    
                        <div class="form-group">
                            <label for="propertyName">Nombre de la Propiedad Horizontal</label>
                            <input type="text" id="propertyName" name="propertyName" class="form-control"
                                placeholder="Ej: Conjunto Residencial Las Acacias" required>
                        </div>
    
                        <div class="form-row">
                            <div class="form-group">
                                <label for="propertyType">Tipo de Propiedad</label>
                                <select id="propertyType" name="propertyType" class="form-control" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="apartamento">Apartamento</option>
                                    <option value="casa">Casa</option>
                                    <option value="local">Local Comercial</option>
                                </select>
                            </div>
    
                            <div class="form-group">
                                <label for="propertyNumber">Número de Propiedad</label>
                                <input type="text" id="propertyNumber" name="propertyNumber" class="form-control"
                                    placeholder="101" required>
                            </div>
                        </div>
    
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <div class="password-container">
                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="••••••••" required>
                                <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="password-strength-meter">
                                <div class="strength-bar"></div>
                                <small class="strength-text">Seguridad: <span id="strength-value">Débil</span></small>
                            </div>
                        </div>
    
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Contraseña</label>
                            <div class="password-container">
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                    placeholder="••••••••" required>
                                <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
    
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-user-plus"></i> Registrarse
                            </button>
                        </div>
    
                        <div class="divider">o</div>
    
                        <button type="button" class="btn btn-google" id="googleSignUp">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg"
                                alt="Google logo">
                            Registrarse con Google
                        </button>
                    </form>
    
                    <div class="form-footer">
                        ¿Ya tienes una cuenta? <a href="inicio_secion.html">Inicia sesión aquí</a>
                    </div>
                </div>
            </section>
        </div>
    
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // Mostrar/ocultar contraseña
                const togglePasswordButtons = document.querySelectorAll('.toggle-password');
                togglePasswordButtons.forEach(button => {
                    button.addEventListener('click', function () {
                        const input = this.parentElement.querySelector('input');
                        const icon = this.querySelector('i');

                        if (input.type === 'password') {
                            input.type = 'text';
                            icon.classList.remove('fa-eye');
                            icon.classList.add('fa-eye-slash');
                        } else {
                            input.type = 'password';
                            icon.classList.remove('fa-eye-slash');
                            icon.classList.add('fa-eye');
                        }
                    });
                });

                // Validación de fortaleza de contraseña
                const passwordInput = document.getElementById('password');
                const strengthBar = document.querySelector('.strength-bar');
                const strengthValue = document.getElementById('strength-value');

                passwordInput.addEventListener('input', function () {
                    const password = this.value;
                    let strength = 0;

                    // Validar longitud
                    if (password.length >= 8) strength += 1;
                    if (password.length >= 12) strength += 1;

                    // Validar caracteres especiales
                    if (/[A-Z]/.test(password)) strength += 1;
                    if (/[0-9]/.test(password)) strength += 1;
                    if (/[^A-Za-z0-9]/.test(password)) strength += 1;

                    // Actualizar interfaz
                    let color, text;
                    switch (strength) {
                        case 0:
                        case 1:
                            color = '#e74c3c';
                            text = 'Débil';
                            break;
                        case 2:
                        case 3:
                            color = '#f39c12';
                            text = 'Moderada';
                            break;
                        case 4:
                            color = '#3498db';
                            text = 'Fuerte';
                            break;
                        case 5:
                            color = '#2ecc71';
                            text = 'Muy fuerte';
                            break;
                    }

                    strengthBar.style.width = `${(strength / 5) * 100}%`;
                    strengthBar.style.backgroundColor = color;
                    strengthValue.textContent = text;
                    strengthValue.style.color = color;
                });

                // Validación de formulario
                const registrationForm = document.getElementById('registrationForm');
                const errorMessage = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');

                registrationForm.addEventListener('submit', function (e) {
                    e.preventDefault();

                    // Validaciones básicas
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;

                    if (password !== confirmPassword) {
                        showError('Las contraseñas no coinciden');
                        return;
                    }

                    if (password.length < 8) {
                        showError('La contraseña debe tener al menos 8 caracteres');
                        return;
                    }

                    // Simular envío exitoso
                    hideError();
                    alert('Registro exitoso. Serás redirigido a tu panel de control.');
                    // window.location.href = '/dashboard.html';
                });

                function showError(message) {
                    errorText.textContent = message;
                    errorMessage.style.display = 'flex';
                }

                function hideError() {
                    errorMessage.style.display = 'none';
                }

                // Autenticación con Google (simulación)
                document.getElementById('googleSignUp').addEventListener('click', function () {
                    alert('En una implementación real, esto redirigiría a autenticación con Google');
                    // Implementar OAuth con Firebase o similar
                });

                // Cambiar bandera según código de país
                const countryCodeSelector = document.getElementById('countryCode');
                countryCodeSelector.addEventListener('change', function () {
                    const selectedOption = this.options[this.selectedIndex];
                    const flagCode = selectedOption.getAttribute('data-flag');
                    this.style.backgroundImage = `url('https://flagcdn.com/w20/${flagCode}.png')`;
                });

                // Inicializar bandera
                countryCodeSelector.dispatchEvent(new Event('change'));
            });
        </script>
    </body>
</html>
